<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可领取订单 · 取餐屏</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.5.2/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.5.2/firebase-database-compat.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #0b141c;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            max-width: 1400px;
            width: 100%;
        }

        /* 头部 */
        .header {
            background: #1e2d3a;
            padding: 20px 28px;
            border-radius: 32px;
            margin-bottom: 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .header h1 {
            font-size: 2rem;
            color: #ffd54f;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header h1 small {
            font-size: 1rem;
            color: #90caf9;
            font-weight: 400;
            margin-left: 8px;
        }

        .stats {
            display: flex;
            gap: 28px;
            font-size: 1rem;
            color: #cfd8dc;
            background: #0f202b;
            padding: 10px 22px;
            border-radius: 60px;
            align-items: center;
            flex-wrap: wrap;
        }

        .stats span {
            color: #66bb6a;
            font-weight: 700;
            font-size: 1.2rem;
            margin-left: 6px;
        }

        .stats .ready-count {
            color: #ffb74d;
        }

        /* 全屏按钮 - 与stats风格统一 */
        .fullscreen-btn {
            background: transparent;
            border: none;
            color: #cfd8dc;
            font-size: 1rem;
            cursor: pointer;
            padding: 4px 12px;
            border-radius: 40px;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
        }
        .fullscreen-btn:hover {
            background: #2a4050;
            color: #fff;
        }
        .fullscreen-btn .fs-icon {
            font-size: 1.2rem;
        }

        /* 网格 */
        .orders-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 24px;
        }

        /* 卡片 */
        .order-card {
            background: #1a2a36;
            border-radius: 28px;
            padding: 22px 20px 18px;
            border-left: 8px solid #ffb74d;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.6);
            transition: transform 0.15s, box-shadow 0.2s;
            animation: fadeSlide 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .order-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.7);
        }

        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .order-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .order-number {
            background: #ffb74d;
            color: #0b141c;
            padding: 6px 20px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1.4rem;
            letter-spacing: 0.5px;
        }

        .table-number {
            background: #2a4b5c;
            color: #e3f2fd;
            padding: 6px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .order-time {
            color: #b0bec5;
            font-size: 0.9rem;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .items-list {
            margin: 6px 0 10px;
            background: #0f1e29;
            padding: 8px 12px;
            border-radius: 20px;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #2b4050;
        }

        .item-row:last-child {
            border-bottom: none;
        }

        .item-name {
            font-size: 1rem;
            color: #eceff1;
        }

        .item-qty {
            color: #ffd54f;
            font-weight: 700;
        }

        .payment {
            color: #81d4fa;
            font-size: 0.95rem;
            margin-top: 4px;
        }

        .total {
            margin-top: 12px;
            font-size: 1.3rem;
            text-align: right;
            color: #69c78b;
            font-weight: 700;
            border-top: 1px dashed #2f4a5a;
            padding-top: 12px;
        }

        .claim-btn {
            width: 100%;
            margin-top: 18px;
            padding: 14px 10px;
            border: none;
            border-radius: 60px;
            background: #ffb74d;
            color: #0b141c;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            letter-spacing: 0.3px;
        }

        .claim-btn:hover {
            background: #ffa726;
            transform: scale(1.01);
            box-shadow: 0 6px 14px rgba(255, 183, 77, 0.3);
        }

        .claim-btn:active {
            transform: scale(0.96);
        }

        .empty {
            text-align: center;
            padding: 80px 20px;
            background: #1a2a36;
            border-radius: 40px;
            color: #7899aa;
            font-size: 1.5rem;
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .empty span {
            font-size: 3rem;
        }

        .loading {
            text-align: center;
            padding: 60px;
            font-size: 1.3rem;
            color: #ffd54f;
            grid-column: 1 / -1;
        }

        /* 小屏 */
        @media (max-width: 700px) {
            body {
                padding: 12px;
            }
            .header {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            .stats {
                justify-content: center;
                flex-wrap: wrap;
            }
            .orders-grid {
                grid-template-columns: 1fr;
            }
            .header h1 {
                font-size: 1.6rem;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>
                🛎️ 可领取订单
                <small>· 厨房已完成</small>
            </h1>
            <div class="stats">
                <div>📦 待领取 <span class="ready-count" id="readyCount">0</span></div>
                <div>🕒 刷新 <span id="updateTime">--:--</span></div>
                <!-- 全屏切换按钮 -->
                <button class="fullscreen-btn" id="fullscreenBtn" title="切换全屏">
                    <span class="fs-icon">⛶</span> <span id="fsLabel">全屏</span>
                </button>
            </div>
        </div>

        <!-- 订单网格 -->
        <div id="ordersGrid" class="orders-grid">
            <div class="loading">⏳ 加载订单中...</div>
        </div>
    </div>

    <script>
        // ---------- Firebase 配置 ----------
        const firebaseConfig = {
            apiKey: "AIzaSyARFD8Zdb7D22XCUJctKM8E-4nVznhqYDc",
            authDomain: "create-for-payment.firebaseapp.com",
            databaseURL: "https://create-for-payment-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "create-for-payment",
            storageBucket: "create-for-payment.firebasestorage.app",
            messagingSenderId: "505063429802",
            appId: "1:505063429802:web:8ec8cca8c788610bad62d3",
            measurementId: "G-SHP91WNP0H"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();
        const ordersRef = database.ref('orders');

        // DOM 元素
        const grid = document.getElementById('ordersGrid');
        const readyCountSpan = document.getElementById('readyCount');
        const updateTimeSpan = document.getElementById('updateTime');

        // ---------- 全屏功能 ----------
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const fsLabel = document.getElementById('fsLabel');

        function updateFullscreenUI() {
            const isFull = !!document.fullscreenElement;
            fsLabel.textContent = isFull ? '退出全屏' : '全屏';
            fullscreenBtn.querySelector('.fs-icon').textContent = isFull ? '⛶' : '⛶';
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.warn('全屏请求被拒绝:', err);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen().catch(err => {
                        console.warn('退出全屏失败:', err);
                    });
                }
            }
        }

        fullscreenBtn.addEventListener('click', toggleFullscreen);
        document.addEventListener('fullscreenchange', updateFullscreenUI);
        document.addEventListener('webkitfullscreenchange', updateFullscreenUI);
        document.addEventListener('mozfullscreenchange', updateFullscreenUI);
        document.addEventListener('MSFullscreenChange', updateFullscreenUI);

        // ---------- 辅助函数 ----------
        function updateClock() {
            updateTimeSpan.textContent = new Date().toLocaleTimeString([], {
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        function formatTime(time) {
            if (!time) return '--:--';
            try {
                return new Date(time).toLocaleTimeString([], {
                    hour: '2-digit',
                    minute: '2-digit'
                });
            } catch {
                return '--:--';
            }
        }

        // ---------- 核心：领取订单 ----------
        function claimOrder(orderId) {
            database.ref('orders/' + orderId).update({
                claimed: true,
                claimedAt: Date.now()
            }).then(() => {
                console.log('✅ 订单已领取:', orderId);
            }).catch(err => {
                console.error('领取失败:', err);
                alert('领取失败，请重试');
            });
        }

        // ---------- 创建卡片 ----------
        function createClaimCard(orderId, data) {
            const card = document.createElement('div');
            card.className = 'order-card';

            let itemsHtml = '';
            if (data.items && Array.isArray(data.items)) {
                data.items.forEach(item => {
                    itemsHtml += `
                            <div class="item-row">
                                <div class="item-name">🍽️ ${escapeHtml(item.name)}</div>
                                <div class="item-qty">×${item.qty || 1}</div>
                            </div>
                        `;
                });
            }

            card.innerHTML = `
                    <div class="order-top">
                        <div class="order-number">#${data.orderNumber || '---'}</div>
                        <div class="table-number">${escapeHtml(data.table || '外带')}</div>
                    </div>
                    <div class="order-time">🕒 完成 ${formatTime(data.completedAt || data.time)}</div>
                    <div class="items-list">${itemsHtml}</div>
                    <div class="payment">💳 ${escapeHtml(data.paymentMethod || 'Cash')}</div>
                    <div class="total">💰 $${Number(data.total || 0).toFixed(2)}</div>
                    <button class="claim-btn" data-orderid="${orderId}">
                        🛒 领取订单
                    </button>
                `;

            const btn = card.querySelector('.claim-btn');
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                const id = this.dataset.orderid;
                if (id) claimOrder(id);
            });

            return card;
        }

        // ---------- 渲染 ----------
        function renderReadyOrders(allData) {
            grid.innerHTML = '';

            if (!allData) {
                grid.innerHTML = `<div class="empty"><span>📭</span> 暂无已完成订单</div>`;
                readyCountSpan.textContent = 0;
                return;
            }

            const entries = Object.entries(allData);
            entries.sort((a, b) => {
                const timeA = a[1].completedAt || a[1].time || 0;
                const timeB = b[1].completedAt || b[1].time || 0;
                return timeB - timeA;
            });

            let readyCount = 0;

            entries.forEach(([key, data]) => {
                if (data.completed === true && data.claimed !== true) {
                    readyCount++;
                    const card = createClaimCard(key, data);
                    grid.appendChild(card);
                }
            });

            readyCountSpan.textContent = readyCount;

            if (readyCount === 0) {
                grid.innerHTML = `
                        <div class="empty">
                            <span>🎉</span> 所有订单已领取<br>
                            <span style="font-size:1rem; color:#90a4ae;">厨房完成的新订单将自动显示</span>
                        </div>
                    `;
            }

            updateClock();
        }

        // ---------- 实时监听 ----------
        ordersRef.on('value', (snapshot) => {
            const data = snapshot.val();
            renderReadyOrders(data);
        });

        setInterval(updateClock, 15000);
        updateClock();
        // 初始化全屏UI
        updateFullscreenUI();

        console.log('✅ 可领取订单屏已启动，等待厨房完成订单...');
    </script>
</body>
</html>
